<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Engineered Hexagon Frame -->
  <polygon points="60,6 106,32 106,88 60,114 14,88 14,32" 
           fill="#141419" 
           stroke="url(#primaryGrad)" 
           stroke-width="4" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Technical Rotor Lines -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Stylized Geometric "M" & "K" (Electromechanical Turbine Impeller Profile) -->
  <!-- Left Pillar of M -->
  <path d="M36 78 L36 42 L48 60 L60 42 L60 78" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- K Structure with Power Lightning Bolt -->
  <path d="M68 42 L68 78" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>
        
  <path d="M84 44 L68 60 L84 76" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Power Core Indicator (Golden Amber) -->
  <circle cx="60" cy="60" r="5" fill="url(#accentGrad)" stroke="#141419" stroke-width="2"/>

  <!-- Corner Calibration Nodes -->
  <circle cx="60" cy="14" r="2.5" fill="#3b82f6"/>
  <circle cx="98" cy="36" r="2.5" fill="#3b82f6"/>
  <circle cx="98" cy="84" r="2.5" fill="#3b82f6"/>
  <circle cx="60" cy="106" r="2.5" fill="#3b82f6"/>
  <circle cx="22" cy="84" r="2.5" fill="#3b82f6"/>
  <circle cx="22" cy="36" r="2.5" fill="#3b82f6"/>
</svg>
